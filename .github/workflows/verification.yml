name: PortfolioPulse hosted verification

on:
  workflow_dispatch:
  push:
    branches: [main]
  schedule:
    - cron: '15 23 * * 1-5'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install lightweight test tools
        run: python -m pip install 'pytest>=8,<10'

      - name: Check Python syntax
        run: python -m compileall -q scripts tests

      - name: Run unit tests
        run: python -m pytest -q

      - name: Determine whether live Neon checks are configured
        env:
          NEON_DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
        run: |
          if [ -n "$NEON_DATABASE_URL" ]; then
            echo 'NEON_CHECKS=enabled' >> "$GITHUB_ENV"
            echo 'Live Neon checks are enabled.' >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'NEON_CHECKS=disabled' >> "$GITHUB_ENV"
            echo 'Live Neon/dbt checks SKIPPED: set the NEON_DATABASE_URL Actions secret.' >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Install full project dependencies (Neon configured only)
        if: env.NEON_CHECKS == 'enabled'
        run: python -m pip install -r requirements.txt

      - name: Verify live Neon connection and all dbt tests
        if: env.NEON_CHECKS == 'enabled'
        env:
          NEON_DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
        run: |
          python scripts/run_dbt.py debug
          python scripts/run_dbt.py test
          echo 'Live Neon connection and dbt test suite passed.' >> "$GITHUB_STEP_SUMMARY"
