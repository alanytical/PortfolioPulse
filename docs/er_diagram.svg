<svg xmlns="http://www.w3.org/2000/svg" width="1140" height="670" viewBox="0 0 1140 670">
<rect width="1140" height="670" fill="#fbfcfe"/>
<text x="56" y="57" font-size="30" font-family="Arial" font-weight="bold" fill="#192a4a">PortfolioPulse — Logical ER Diagram</text>
<text x="56" y="82" font-size="14" font-family="Arial" fill="#566279">Date/ticker + trading records + FX → dbt portfolio marts</text>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0 0 L9 3 L0 6" fill="none" stroke="#2c8281" stroke-width="2"/></marker></defs>
<g font-family="Arial" font-size="15" fill="#223254">
<rect x="55" y="124" width="302" height="164" rx="10" fill="white" stroke="#9baec9"/><rect x="55" y="124" width="302" height="37" rx="10" fill="#1c3157"/><text x="70" y="148" font-weight="bold" fill="white">raw.stock_prices (yfinance)</text><text x="70" y="187">PK: price_date + ticker</text><text x="70" y="212">close_usd</text><text x="70" y="237">volume, ingested_at</text>
<rect x="55" y="320" width="302" height="164" rx="10" fill="white" stroke="#9baec9"/><rect x="55" y="320" width="302" height="37" rx="10" fill="#1c3157"/><text x="70" y="344" font-weight="bold" fill="white">raw.trade_log (Google Sheet)</text><text x="70" y="383">trade_id, trade_date, ticker</text><text x="70" y="408">shares_bought</text><text x="70" y="433">price_paid</text>
<rect x="55" y="515" width="302" height="130" rx="10" fill="white" stroke="#9baec9"/><rect x="55" y="515" width="302" height="37" rx="10" fill="#1c3157"/><text x="70" y="539" font-weight="bold" fill="white">raw.exchange_rates (Airbyte)</text><text x="70" y="578">date + base + quote</text><text x="70" y="603">rate (USD → NGN)</text>
<rect x="527" y="222" width="560" height="221" rx="10" fill="white" stroke="#2c8281" stroke-width="2"/><rect x="527" y="222" width="560" height="40" rx="10" fill="#1a746f"/><text x="544" y="248" font-size="18" font-weight="bold" fill="white">analytics.mart_portfolio_value (dbt)</text><text x="545" y="292">Logical key: price_date + ticker</text><text x="545" y="321">shares_held, close_usd, total_cost_usd</text><text x="545" y="350">position_value_usd, unrealized_gain_loss_usd</text><text x="545" y="379">usd_ngn_rate, position_value_ngn</text><text x="545" y="414" font-size="13" fill="#596579">Daily and latest marts aggregate this view</text>
<path d="M357 208 C442 208 441 287 527 287" fill="none" stroke="#2c8281" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M357 400 L527 330" fill="none" stroke="#2c8281" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M357 575 C456 575 463 380 527 380" fill="none" stroke="#2c8281" stroke-width="2.5" marker-end="url(#arrow)"/>
<text x="543" y="500" font-size="14" fill="#566279">Relational grain: daily close is dated by ticker; historical</text><text x="543" y="523" font-size="14" fill="#566279">trades join by ticker with trade_date ≤ price_date;</text><text x="543" y="546" font-size="14" fill="#566279">FX as-of join takes the latest available earlier rate.</text>
</g></svg>
